services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pezeshki}
      POSTGRES_USER: ${POSTGRES_USER:-pezeshki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: localstack/localstack:4.11.1
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      PERSISTENCE: "1"
      LS_LOG: warn
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - object_storage_data:/var/lib/localstack
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q s3
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  object_storage_data: